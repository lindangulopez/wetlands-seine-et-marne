site_name: Wetlands of Seine-et-Marne, a catchment view
site_description: Vegetation, soils and wetland species in the river catchments that drain Seine-et-Marne, mapped from open data (GBIF, INRAE, CORINE Land Cover, IGN, INPN), with a November wetland story series.
site_author: Linda Angulo Lopez
site_url: https://lindangulopez.github.io/wetlands-seine-et-marne/
repo_url: https://github.com/lindangulopez/wetlands-seine-et-marne
repo_name: lindangulopez/wetlands-seine-et-marne
edit_uri: edit/main/docs/
copyright: Linda Angulo Lopez, November 2026. Written with the help of Claude (Anthropic). Source data under their own licences, see Sources and method.

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences

plugins:
  - search
  - glightbox:
      touchNavigation: true
      zoomable: true
      draggable: true
      skip_classes:
        - no-zoom
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Zones humides de Seine-et-Marne, par bassin versant
          site_description: Végétation, sols et espèces des zones humides dans les bassins versants qui drainent la Seine-et-Marne, cartographiés à partir de données ouvertes (GBIF, INRAE, CORINE Land Cover, IGN, INPN), avec un récit de novembre.
          nav_translations:
            Overview: Présentation
            Slides: Diapositives
            1 · Catchments: 1 · Bassins versants
            2 · Soils: 2 · Sols
            3 · Vegetation: 3 · Végétation
            4 · Species: 4 · Espèces
            5 · Loing valley: 5 · Vallée du Loing
            6 · Wetlands: 6 · Zones humides
            Interactive map: Carte interactive
            Stories: Récits
            November: Novembre
            Day 1, meadowsweet: Jour 1, reine-des-prés
            Habitat, the mégaphorbiaie: Habitat, la mégaphorbiaie
            Day 2, little grebe: Jour 2, grèbe castagneux
            Day 3, emperor dragonfly: Jour 3, anax empereur
            Day 4, agile frog: Jour 4, grenouille agile
            Day 5, wet soils: Jour 5, sols humides
            Day 6, the ecosystem: Jour 6, l'écosystème
            Winter: Hiver
            Spring: Printemps
            Summer: Été
            Autumn: Automne
            Mushroom hunting: Aux champignons
            Learn the species: Apprendre les espèces
            Sources and method: Sources et méthode

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Slides:
      - 1 · Catchments: catchments.md
      - 2 · Soils: soils.md
      - 3 · Vegetation: vegetation.md
      - 4 · Species: species.md
      - 5 · Loing valley: loing.md
      - 6 · Wetlands: wetlands.md
  - Interactive map: map.md
  - Stories:
      - story/index.md
      - November:
          - "Habitat, the mégaphorbiaie": story/megaphorbiaie.md
          - "Day 1, meadowsweet": story/day-1-meadowsweet.md
          - "Day 2, little grebe": story/day-2-little-grebe.md
          - "Day 3, emperor dragonfly": story/day-3-emperor-dragonfly.md
          - "Day 4, agile frog": story/day-4-agile-frog.md
          - "Day 5, wet soils": story/day-5-wet-soils.md
          - "Day 6, the ecosystem": story/day-6-ecosystem.md
      - "Winter": story/winter.md
      - "Spring": story/spring.md
      - "Summer": story/summer.md
      - "Autumn": story/autumn.md
      - "Mushroom hunting": story/mushrooms.md
  - Learn the species: flashcards.md
  - Sources and method: sources.md
